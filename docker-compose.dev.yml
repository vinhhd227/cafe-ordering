services:
  # Database service
  cafe-db:
    image: postgres:16-alpine
    container_name: cafe-db-dev
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-cafe_ordering_db}
    ports:
      - "5434:5432"
    volumes:
      - cafe-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-cafe_ordering_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cafe-network

  # Nginx — serves uploaded static files (images) from the shared volume
  nginx:
    image: nginx:alpine
    container_name: cafe-nginx-dev
    ports:
      - "${NGINX_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - cafe-uploads:/data/uploads:ro
    networks:
      - cafe-network

  # Seq — structured log UI (http://localhost:5341)
  seq:
    image: datalust/seq:latest
    container_name: cafe-seq-dev
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - cafe-seq-data:/data
    networks:
      - cafe-network

# Shared resources
volumes:
  cafe-db-data:
  cafe-uploads: # Shared between API (write) and Nginx (read-only serve)
  cafe-seq-data:

networks:
  cafe-network:
    driver: bridge
