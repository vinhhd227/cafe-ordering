x-frontend-env: &frontend-env
  CHOKIDAR_USEPOLLING: "true"
  VITE_API_BASE_URL: /api
  VITE_API_PROXY_TARGET: http://api:8080

services:
  # Database service
  cafe-db:
    image: postgres:16-alpine
    container_name: cafe-db-dev
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-cafe_ordering_db}
    ports:
      - "5432:5432"
    volumes:
      - cafe-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cafe_ordering_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cafe-network

  # Backend API
  api:
    container_name: coffee-api-dev
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    depends_on:
      cafe-db:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=cafe-db;Port=5432;Database=${DB_NAME:-cafe_ordering_db};Username=${DB_USER:-admin};Password=${DB_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Jwt__Key=${JWT_KEY:?JWT_KEY is required}
      - Cors__AllowedOrigins__0=http://localhost:5173
      - Cors__AllowedOrigins__1=http://localhost:5174
      - Cors__AllowedOrigins__2=http://${HOST_IP:-localhost}:5173
      - Cors__AllowedOrigins__3=http://${HOST_IP:-localhost}:5174
      - FileStorage__BasePath=/app/uploads
      - FileStorage__BaseUrl=http://${HOST_IP:-localhost}:${NGINX_PORT:-8081}/uploads
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./api:/app # Must match WORKDIR in api/Dockerfile.dev
      - cafe-uploads:/app/uploads # Shared with Nginx for static file serving
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/openapi/v1.json > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cafe-network

  # Nginx — serves uploaded static files (images) from the shared volume
  nginx:
    image: nginx:alpine
    container_name: cafe-nginx-dev
    ports:
      - "${NGINX_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - cafe-uploads:/data/uploads:ro
    networks:
      - cafe-network

  # Frontend client (Vue)
  client:
    container_name: coffee-client-dev
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "5174:5174"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./client:/app
      - /app/node_modules # Anonymous volume prevents host/container node_modules conflicts
    environment:
      <<: *frontend-env
    networks:
      - cafe-network

  # Frontend admin (Vue)
  admin:
    container_name: coffee-admin-dev
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./admin:/app
      - /app/node_modules
    environment:
      <<: *frontend-env
    networks:
      - cafe-network

  # Cloudflare Tunnel — exposes dev via demo.5-am-coffee.com
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cafe-cloudflared-dev
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.dev.yml run
    volumes:
      - ~/.cloudflared:/etc/cloudflared:ro
    depends_on:
      - client
      - admin
      - api
    networks:
      - cafe-network

# Shared resources
volumes:
  cafe-db-data:
  cafe-uploads: # Shared between API (write) and Nginx (read-only serve)

networks:
  cafe-network:
    driver: bridge
