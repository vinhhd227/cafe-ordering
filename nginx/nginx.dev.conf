server {
    listen 80;

    # Serve uploaded product images from the shared Docker volume.
    # The volume is mounted read-only at /data/uploads inside this container.
    location /uploads/ {
        alias /data/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";

        # Allow CORS for image tags loaded by the frontend
        add_header Access-Control-Allow-Origin "*";
    }

    # Reject everything else — this server only handles static files.
    location / {
        return 404;
    }
}
