server {
    listen 80;

    # Serve uploaded product images from the shared Docker volume.
    location /uploads/ {
        alias /data/uploads/;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Health check endpoint for Docker healthcheck.
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Reject everything else — this server only handles static files.
    location / {
        return 404;
    }
}
